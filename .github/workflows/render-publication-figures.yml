name: render-publication-figures

on:
  push:
    branches:
      - supervisor/figures-manuscript
    paths:
      - "analysis/figures/**"
      - "config/figure_style.json"
      - "results/manuscript/manuscript_numbers.tsv"
      - "results/callability/**"
      - "results/confounding/**"
      - "metadata/loci/analysis_universe.tsv"
      - "metadata/validation/motif_validation_status.tsv"
      - "environment/figures-requirements.txt"
      - ".github/workflows/render-publication-figures.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  render:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: supervisor/figures-manuscript
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -r environment/figures-requirements.txt
      - name: Build manuscript tables
        run: python analysis/tables/build_main_tables.py
      - name: Render first pass
        run: |
          python analysis/figures/figure1_catalogue_universe.py
          python analysis/figures/figure2_validation.py
          python analysis/figures/figure3_failure_modes.py
          python analysis/figures/figure4_public_cohort_stress_test.py
          find figures/source_data -type f -print0 | sort -z | xargs -0 sha256sum > /tmp/source-pass1.sha256
      - name: Re-render and verify deterministic source data
        run: |
          python analysis/figures/figure1_catalogue_universe.py
          python analysis/figures/figure2_validation.py
          python analysis/figures/figure3_failure_modes.py
          python analysis/figures/figure4_public_cohort_stress_test.py
          find figures/source_data -type f -print0 | sort -z | xargs -0 sha256sum > /tmp/source-pass2.sha256
          diff -u /tmp/source-pass1.sha256 /tmp/source-pass2.sha256
      - name: Publication text guard
        run: |
          ! grep -RniE 'PV-distance|44/45|phase-variable genes tested for disease association' figures analysis/figures
      - name: Output sanity
        run: |
          test $(find figures/main -type f -name '*.png' | wc -l) -eq 4
          test $(find figures/main -type f -name '*.svg' | wc -l) -eq 4
          test $(find figures/main -type f -name '*.pdf' | wc -l) -eq 4
          find figures/main -type f -size -10k -print -quit | (! read)
      - name: Record tested figure environment
        run: python -m pip freeze > environment/figures-lock.txt
      - name: Upload rendered figures for visual QA
        uses: actions/upload-artifact@v4
        with:
          name: publication-figures
          path: |
            figures/main/
            figures/source_data/
            tables/main/
          if-no-files-found: error
      - name: Commit rendered publication figures
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add figures/main figures/source_data tables/main environment/figures-lock.txt
          if git diff --cached --quiet; then
            echo "No rendered changes to commit."
          else
            git commit -m "Render publication figures from frozen tracked results"
            git push origin HEAD:supervisor/figures-manuscript
          fi
